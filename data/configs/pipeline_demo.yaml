# DEMO config (dữ liệu tổng hợp). Bản thật: configs/pipeline.yaml
data_root: demo/raw                 # thư mục chứa dữ liệu gốc đã tải
work_dir: demo/work                 # file trung gian *.jsonl
out_dir: demo/dataset_out           # bộ dữ liệu YOLO-seg cuối cùng
classes: configs/classes.yaml
sources: configs/sources_demo.yaml
seed: 15
workers: 8

# ---- Nhãn thiếu (partial) ----
# require_completion : ảnh của nguồn partial chỉ được dùng khi đã chạy bước teacher (stage "complete")
# allow              : dùng luôn (chấp nhận false negative) — không khuyến nghị
partial_label_policy: require_completion

# ---- Teacher / SAM (cần GPU) ----
sam_model: sam2.1_b.pt          # hoặc sam3.pt (xin quyền trên Hugging Face)
teacher_model: null             # vd runs/teacher/yolo26x-seg/weights/best.pt
teacher_conf: 0.5

# ---- Loại trùng ----
dedupe:
  hamming_thr: 4                # pHash 64-bit; <=4 coi là cùng ảnh
  max_per_group: 100            # trần số khung hình / 1 chuỗi video (group)

# ---- Gắn điều kiện ----
conditions:
  night_luma_thr: 70            # độ sáng trung bình (0-255) dưới ngưỡng -> night

# ---- Chia tập ----
split:
  val_fraction: 0.25            # tính trên các group của nguồn use_for_val (CHỈ ảnh VN)
  test_fraction: 0.10

# ---- Cân bằng (chọn ảnh cho tập train) ----
balance:
  target_instances_per_class: 250   # mục tiêu như nhau cho mọi class
  max_images: 450                   # ngân sách ảnh train
  always_include_domains: [vn]        # giữ toàn bộ ảnh VN có nhãn đầy đủ
  min_domain_share: {vn: 0.35}        # tối thiểu 35% ảnh train là ảnh VN (bù bằng lặp ảnh nếu thiếu)
  condition_bonus: {night: 0.25, rain: 0.25, fog: 0.15, snow: 0.0}
  overshoot_penalty: 0.05             # phạt mỗi instance của class đã vượt quá overshoot_free_ratio × T
  overshoot_free_ratio: 1.5           # class được phép vượt target tới 1.5×T mà không bị phạt
  batch_size: 16                     # số ảnh chọn mỗi vòng greedy
  background_fraction: 0.02           # ảnh không có đối tượng (giảm false positive)
  # Repeat-factor sampling (LVIS) trên tập đã chọn:
  rfs_threshold: 0.50
  rfs_max_repeat: 4

# ---- Xuất ----
export:
  max_side: 1280                # resize cạnh dài (train ở 640 nên không mất thông tin)
  jpeg_quality: 95
  make_zip: true                # du_lieu.zip đúng cấu trúc BTC (images/, labels/, data.yaml)
  zip_name: du_lieu.zip
