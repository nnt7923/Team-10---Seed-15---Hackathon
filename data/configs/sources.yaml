# =============================================================================
# REGISTRY NGUỒN DỮ LIỆU  (provenance + cách đọc + ánh xạ class)
# -----------------------------------------------------------------------------
# Mỗi nguồn khai báo:
#   id, name, homepage, download, license, citation   -> metadata nguồn gốc
#   domain        : vn | asia | global   (dùng cho quota miền Việt Nam)
#   tier          : A (VN) | B (châu Á) | C (bộ lớn) | D (thời tiết xấu) | E (tự thu)
#   priority      : ưu tiên khi loại ảnh trùng (cao hơn được giữ)
#   format        : yolo_seg | yolo_det | coco | coco_bbox | coco_panoptic
#                   | polygons_json | bdd_scalabel | images_only
#   paths         : tương đối so với data_root (pipeline.yaml)
#   label_map     : nhãn gốc -> token đích. Hỗ trợ glob (*, ?). Nhãn không khớp = bỏ.
#                   Token đích: 11 class + đặc biệt:
#                     "@rider" "@rider_moto" "@rider_bike"  người lái (sẽ ghép với xe)
#                     "@person"  người mơ hồ (COCO) -> rider nếu ngồi trên xe, else pedestrian
#                     "@ignore"  bỏ (nhóm đám đông, mặt sau biển báo...)
#   labeled_classes : class được gán nhãn ĐẦY ĐỦ trong nguồn. Class thiếu = "partial"
#                     -> cần bước teacher completion, nếu không sẽ tạo false negative.
#   max_images    : trần số ảnh lấy từ nguồn (null = không giới hạn)
#   enabled       : bật khi đã tải dữ liệu về.
# Khác biệt guideline BTC cần nhớ: bán tải & xe 9–15 chỗ = Car; rơ-moóc/container = Other vehicle;
# xe đẩy tay, động vật, người trong ô tô, biển quảng cáo = KHÔNG gán; vật cạnh ngắn < 1.25% = KHÔNG gán.
# !!! Tên nhãn gốc ở đây lấy theo tài liệu công khai; HÃY đối chiếu với file
#     config/meta của bản bạn tải về (vd Mapillary config_v2.0.json) trước khi chạy.
# =============================================================================

ALL: &ALL [car, bus, truck, other_vehicle, motorcycle, motorcyclist, bicycle, cyclist, pedestrian, sign, traffic_light]

sources:

  # ---------------------------------------------------------------- Tier A: VN
  # BTC KHÔNG cấp dữ liệu train (chỉ 10 ảnh mẫu tổng hợp). Nguồn chuẩn vàng = ảnh VN đội tự gán nhãn
  # theo labeling guideline của BTC (SAM 3 vẽ nháp -> người sửa -> người thứ 2 duyệt).
  # Đây là nguồn DUY NHẤT dùng cho val/test.
  - id: vn_manual_labeled
    name: "Ảnh giao thông VN do đội tự gán nhãn theo guideline BTC"
    tier: A
    domain: vn
    priority: 100
    homepage: "https://competition.antco.ai (guideline: /data/labeling_guideline.md)"
    download: {method: manual, instructions: "Ảnh/khung hình VN tự chụp hoặc cắt từ video; gán nhãn trong CVAT/Label Studio, xuất YOLO-seg vào raw/vn_manual_labeled/{images,labels}/<video_or_batch>/"}
    license: "Tự sở hữu"
    citation: null
    format: yolo_seg
    paths: {images: vn_manual_labeled/images, labels: vn_manual_labeled/labels}
    label_map: {"0": car, "1": bus, "2": truck, "3": other_vehicle, "4": motorcycle, "5": motorcyclist,
                "6": bicycle, "7": cyclist, "8": pedestrian, "9": sign, "10": traffic_light}
    labeled_classes: *ALL
    use_for_val: true
    enabled: false

  - id: vn_traffic_viseg
    name: "BDD100K-ViSeg / VN-Traffic-Instance-Segmentation (YOLO11)"
    tier: A
    domain: vn
    priority: 90
    homepage: "https://github.com/Tuanvinh1307/VN-Traffic-Instance-Segmentation-YOLO11"
    download: {method: manual, instructions: "Làm theo README của repo; đặt dạng YOLO-seg vào raw/vn_traffic_viseg/{images,labels} và data.yaml"}
    license: "Kiểm tra LICENSE của repo trước khi dùng"
    citation: "Tuanvinh1307, VN-Traffic-Instance-Segmentation-YOLO11, GitHub"
    format: yolo_seg
    paths: {images: vn_traffic_viseg/images, labels: vn_traffic_viseg/labels, data_yaml: vn_traffic_viseg/data.yaml}
    # !!! Điền theo names trong data.yaml của repo (ví dụ dưới là giả định):
    label_map: {car: car, bus: bus, truck: truck, motorcycle: motorcycle, motorbike: motorcycle,
                bicycle: bicycle, person: "@person", pedestrian: pedestrian, rider: "@rider"}
    labeled_classes: [car, bus, truck, motorcycle, motorcyclist, bicycle, cyclist, pedestrian]
    use_for_val: true
    enabled: false

  - id: roboflow_vn_traffic
    name: "Roboflow Universe – vn_traffic (projectxla)"
    tier: A
    domain: vn
    priority: 60
    homepage: "https://universe.roboflow.com/projectxla/vn_traffic"
    download: {method: roboflow, workspace: projectxla, project: vn_traffic, version: 1, format: yolov8}
    license: "Xem trang dự án trên Roboflow (thường CC BY 4.0)"
    citation: "projectxla, vn_traffic Dataset, Roboflow Universe"
    format: yolo_det                 # chỉ có box -> bước SAM tạo mask
    paths: {images: roboflow_vn_traffic/train/images, labels: roboflow_vn_traffic/train/labels, data_yaml: roboflow_vn_traffic/data.yaml}
    label_map: {car: car, bus: bus, truck: truck, motorbike: motorcycle, motorcycle: motorcycle, person: "@person", bicycle: bicycle}
    labeled_classes: [car, bus, truck, motorcycle, motorcyclist, bicycle, cyclist, pedestrian]
    enabled: false

  - id: zalo_traffic_sign_2020
    name: "Zalo AI Challenge 2020 – Traffic Sign Detection"
    tier: A
    domain: vn
    priority: 55
    homepage: "https://datasetninja.com/zalo-traffic-sign"
    download: {method: manual, instructions: "Tải bản gốc Zalo AI 2020 (traffic sign); đặt ảnh vào raw/zalo_traffic_sign_2020/images và json COCO vào annotations.json"}
    license: "Không rõ (unknown) – chỉ dùng nội bộ"
    citation: "Zalo AI Challenge 2020"
    format: coco_bbox
    paths: {images: zalo_traffic_sign_2020/images, annotations: zalo_traffic_sign_2020/annotations.json}
    label_map: {"*": sign}
    labeled_classes: [sign]          # các class khác KHÔNG được gán -> partial
    enabled: false

  - id: vn_dashcam_self
    name: "Video dashcam Việt Nam tự thu (cắt khung hình)"
    tier: E
    domain: vn
    priority: 50
    homepage: null
    download: {method: manual, instructions: "Cắt 1 khung hình/giây bằng scripts/extract_frames.py vào raw/vn_dashcam_self/images/<video_id>/"}
    license: "Tự sở hữu / theo nguồn video"
    citation: null
    format: images_only
    paths: {images: vn_dashcam_self/images}
    label_map: {}
    labeled_classes: []              # gán nhãn hoàn toàn bằng teacher + SAM, rồi người duyệt
    use_for_val: false
    enabled: false

  # ---------------------------------------------------------- Tier B: châu Á
  # ⏱ IDD và Cityscapes phải chờ duyệt tài khoản (có thể vài ngày) -> chỉ dùng nếu đã có tài khoản.
  - id: idd_segmentation
    name: "India Driving Dataset (IDD) – Segmentation"
    tier: B
    domain: asia
    priority: 70
    homepage: "https://inai.iiit.ac.in/domains/idd.html"
    download: {method: manual, instructions: "Đăng ký tài khoản IDD, tải 'IDD Segmentation (IDD 20k Part I/II)', giải nén vào raw/idd/"}
    license: "IDD license (phi thương mại, nghiên cứu)"
    citation: "Varma et al., IDD: A Dataset for Exploring Problems of Autonomous Navigation in Unconstrained Environments, WACV 2019"
    format: polygons_json
    paths: {annotations: idd/gtFine, images: idd/leftImg8bit}
    name_replace: ["_gtFine_polygons.json", "_leftImg8bit.png"]
    occlusion_order: back_to_front
    label_map:
      person: pedestrian
      rider: "@rider"
      motorcycle: motorcycle
      bicycle: bicycle
      autorickshaw: other_vehicle
      car: car
      truck: truck
      bus: bus
      caravan: other_vehicle
      trailer: other_vehicle
      train: other_vehicle
      "vehicle fallback": other_vehicle
      "traffic sign": sign
      "traffic light": traffic_light
      "*group": "@ignore"
    labeled_classes: *ALL
    enabled: false

  # ------------------------------------------------------ Tier C: bộ lớn
  - id: mapillary_vistas_v2
    name: "Mapillary Vistas v2.0"
    tier: C
    domain: global
    priority: 75
    homepage: "https://www.mapillary.com/dataset/vistas"
    download: {method: manual, instructions: "Đăng ký tải Research edition; giải nén vào raw/mapillary/{training,validation}"}
    license: "CC BY-NC-SA 4.0 (Research edition)"
    citation: "Neuhold et al., The Mapillary Vistas Dataset for Semantic Understanding of Street Scenes, ICCV 2017"
    format: polygons_json
    paths: {annotations: mapillary/training/v2.0/polygons, images: mapillary/training/images}
    name_replace: [".json", ".jpg"]
    occlusion_order: back_to_front
    label_map:
      "human--person--individual": pedestrian
      "human--person--person-group": "@ignore"
      "human--rider--motorcyclist": "@rider_moto"
      "human--rider--bicyclist": "@rider_bike"
      "human--rider--other-rider": "@rider"
      "object--vehicle--car": car
      "object--vehicle--bus": bus
      "object--vehicle--truck": truck
      "object--vehicle--motorcycle": motorcycle
      "object--vehicle--bicycle": bicycle
      "object--vehicle--caravan": other_vehicle
      "object--vehicle--trailer": other_vehicle
      "object--vehicle--other-vehicle": other_vehicle
      "object--vehicle--on-rails": other_vehicle      # BTC: mọi phương tiện không thuộc lớp khác
      "object--vehicle--wheeled-slow": "@ignore"      # xe đẩy tay, xe lăn: BTC KHÔNG gán
      "object--vehicle--vehicle-group": "@ignore"
      "object--traffic-light--*": traffic_light
      "object--traffic-sign--*back*": "@ignore"
      "object--traffic-sign--*": sign
    labeled_classes: *ALL
    enabled: false

  - id: cityscapes
    name: "Cityscapes (gtFine)"
    tier: C
    domain: global
    priority: 65
    homepage: "https://www.cityscapes-dataset.com/"
    download: {method: manual, instructions: "Đăng ký, tải gtFine_trainvaltest.zip + leftImg8bit_trainvaltest.zip vào raw/cityscapes/"}
    license: "Cityscapes license (phi thương mại)"
    citation: "Cordts et al., The Cityscapes Dataset for Semantic Urban Scene Understanding, CVPR 2016"
    format: polygons_json
    paths: {annotations: cityscapes/gtFine, images: cityscapes/leftImg8bit}
    name_replace: ["_gtFine_polygons.json", "_leftImg8bit.png"]
    occlusion_order: back_to_front
    label_map:
      person: pedestrian
      rider: "@rider"
      car: car
      truck: truck
      bus: bus
      caravan: other_vehicle
      trailer: other_vehicle
      train: other_vehicle
      motorcycle: motorcycle
      bicycle: bicycle
      "traffic sign": sign
      "traffic light": traffic_light
      "*group": "@ignore"
    labeled_classes: *ALL
    max_images: 3000                 # đường phố Đức: giới hạn để không lấn miền VN
    enabled: false

  - id: bdd100k_ins_seg
    name: "BDD100K – Instance Segmentation 10K"
    tier: C
    domain: global
    priority: 60
    homepage: "https://bdd-data.berkeley.edu/"
    download: {method: manual, instructions: "Đăng ký, tải '10K Images' + 'Instance Segmentation' (Scalabel JSON) vào raw/bdd100k/"}
    license: "BDD100K license (xem file LICENSE chính thức)"
    citation: "Yu et al., BDD100K: A Diverse Driving Dataset for Heterogeneous Multitask Learning, CVPR 2020"
    format: bdd_scalabel
    paths: {annotations: bdd100k/labels/ins_seg/polygons/ins_seg_train.json, images: bdd100k/images/10k/train}
    label_map: {pedestrian: pedestrian, rider: "@rider", car: car, truck: truck, bus: bus,
                motorcycle: motorcycle, bicycle: bicycle, "other vehicle": other_vehicle, trailer: other_vehicle,
                train: other_vehicle}
    labeled_classes: [car, bus, truck, other_vehicle, motorcycle, motorcyclist, bicycle, cyclist, pedestrian]
    enabled: false

  - id: coco2017_street
    name: "MS COCO 2017 – tập con cảnh đường phố"
    tier: C
    domain: global
    priority: 40
    homepage: "https://cocodataset.org/"
    download: {method: url, files: ["http://images.cocodataset.org/annotations/annotations_trainval2017.zip"],
               images_url: "http://images.cocodataset.org/train2017/{file_name}", note: "Chỉ tải ảnh đã qua bộ lọc (scripts/download.py)"}
    license: "Annotations CC BY 4.0; ảnh theo license Flickr từng ảnh"
    citation: "Lin et al., Microsoft COCO: Common Objects in Context, ECCV 2014"
    format: coco
    paths: {annotations: coco/annotations/instances_train2017.json, images: coco/train2017}
    select: {min_target_instances: 4, require_any: [car, bus, truck, motorcycle, bicycle, traffic_light]}
    label_map: {person: "@person", bicycle: bicycle, car: car, motorcycle: motorcycle, bus: bus,
                truck: truck, "traffic light": traffic_light, "stop sign": sign}
    labeled_classes: [car, bus, truck, motorcycle, motorcyclist, bicycle, cyclist, pedestrian, traffic_light]
    max_images: 6000
    # Nhiễu đã biết so với guideline BTC: COCO "truck" gồm cả bán tải (BTC: Car) và xe container
    # (BTC: đầu kéo = Truck, rơ-moóc = Other vehicle). Ghi vào báo cáo.
    enabled: false

  # --------------------------------------------------- Tier D: thời tiết xấu
  - id: acdc
    name: "ACDC – Adverse Conditions Dataset (fog/night/rain/snow)"
    tier: D
    domain: global
    priority: 65
    homepage: "https://acdc.vision.ee.ethz.ch/"
    download: {method: manual, instructions: "Đăng ký, tải rgb_anon + gt_panoptic vào raw/acdc/"}
    license: "ACDC license (phi thương mại)"
    citation: "Sakaridis et al., ACDC: The Adverse Conditions Dataset with Correspondences, ICCV 2021 / T-PAMI 2025"
    format: coco_panoptic
    paths: {annotations: acdc/gt_panoptic/train_panoptic.json, panoptic_png: acdc/gt_panoptic, images: acdc/rgb_anon}
    attr_from_path: {weather: "(fog|night|rain|snow)"}
    split_components: [sign, traffic_light]   # stuff-class trong panoptic -> tách thành phần liên thông
    label_map:
      person: pedestrian
      rider: "@rider"
      car: car
      truck: truck
      bus: bus
      train: other_vehicle
      motorcycle: motorcycle
      bicycle: bicycle
      "traffic sign": sign
      "traffic light": traffic_light
    labeled_classes: *ALL
    enabled: false
