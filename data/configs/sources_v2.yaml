# v2 source registry (copy of sources.yaml + v2 teacher options). v1 uses sources.yaml unchanged.
# =============================================================================
# REGISTRY NGUỒN DỮ LIỆU  (provenance + cách đọc + ánh xạ class)
# -----------------------------------------------------------------------------
# Mỗi nguồn khai báo:
#   id, name, homepage, download, license, citation   -> metadata nguồn gốc
#   domain        : vn | asia | global   (dùng cho quota miền Việt Nam)
#   tier          : A (VN) | B (châu Á) | C (bộ lớn) | D (thời tiết xấu) | E (tự thu)
#   priority      : ưu tiên khi loại ảnh trùng (cao hơn được giữ)
#   format        : yolo_seg | yolo_det | coco | coco_bbox | coco_panoptic
#                   | polygons_json | bdd_scalabel | images_only
#   paths         : tương đối so với data_root (pipeline.yaml)
#   label_map     : nhãn gốc -> token đích. Hỗ trợ glob (*, ?). Nhãn không khớp = bỏ.
#                   Token đích: 11 class + đặc biệt:
#                     "@rider" "@rider_moto" "@rider_bike"  người lái (sẽ ghép với xe)
#                     "@person"  người mơ hồ (COCO) -> rider nếu ngồi trên xe, else pedestrian
#                     "@ignore"  bỏ (nhóm đám đông, mặt sau biển báo...)
#   labeled_classes : class được gán nhãn ĐẦY ĐỦ trong nguồn. Class thiếu = "partial"
#                     -> cần bước teacher completion, nếu không sẽ tạo false negative.
#   max_images    : trần số ảnh lấy từ nguồn (null = không giới hạn)
#   enabled       : bật khi đã tải dữ liệu về.
# Khác biệt guideline BTC cần nhớ: bán tải & xe 9–15 chỗ = Car; rơ-moóc/container = Other vehicle;
# xe đẩy tay, động vật, người trong ô tô, biển quảng cáo = KHÔNG gán; vật cạnh ngắn < 1.25% = KHÔNG gán.
# !!! Tên nhãn gốc ở đây lấy theo tài liệu công khai; HÃY đối chiếu với file
#     config/meta của bản bạn tải về (vd Mapillary config_v2.0.json) trước khi chạy.
# =============================================================================

ALL: &ALL [car, bus, truck, other_vehicle, motorcycle, motorcyclist, bicycle, cyclist, pedestrian, sign, traffic_light]

sources:

  # ---------------------------------------------------------------- Tier A: VN
  # BTC KHÔNG cấp dữ liệu train (chỉ 10 ảnh mẫu tổng hợp). Nguồn chuẩn vàng = ảnh VN đội tự gán nhãn
  # theo labeling guideline của BTC (SAM 3 vẽ nháp -> người sửa -> người thứ 2 duyệt).
  # Đây là nguồn DUY NHẤT dùng cho val/test.
  - id: vn_manual_labeled
    name: "Ảnh giao thông VN do đội tự gán nhãn theo guideline BTC"
    tier: A
    domain: vn
    priority: 100
    homepage: "https://competition.antco.ai (guideline: /data/labeling_guideline.md)"
    download: {method: manual, instructions: "Ảnh/khung hình VN tự chụp hoặc cắt từ video; gán nhãn trong CVAT/Label Studio, xuất YOLO-seg vào raw/vn_manual_labeled/{images,labels}/<video_or_batch>/"}
    license: "Tự sở hữu"
    citation: null
    format: yolo_seg
    paths: {images: vn_manual_labeled/images, labels: vn_manual_labeled/labels}
    label_map: {"0": car, "1": bus, "2": truck, "3": other_vehicle, "4": motorcycle, "5": motorcyclist,
                "6": bicycle, "7": cyclist, "8": pedestrian, "9": sign, "10": traffic_light}
    labeled_classes: *ALL
    use_for_val: true
    enabled: false

  - id: vn_traffic_viseg
    name: "BDD100K-ViSeg / VN-Traffic-Instance-Segmentation (YOLO11)"
    tier: A
    domain: vn
    priority: 90
    homepage: "https://github.com/Tuanvinh1307/VN-Traffic-Instance-Segmentation-YOLO11"
    download: {method: manual, instructions: "Làm theo README của repo; đặt dạng YOLO-seg vào raw/vn_traffic_viseg/{images,labels} và data.yaml"}
    license: "Kiểm tra LICENSE của repo trước khi dùng"
    citation: "Tuanvinh1307, VN-Traffic-Instance-Segmentation-YOLO11, GitHub"
    format: yolo_seg
    paths: {images: vn_traffic_viseg/images, labels: vn_traffic_viseg/labels, data_yaml: vn_traffic_viseg/data.yaml}
    # !!! Điền theo names trong data.yaml của repo (ví dụ dưới là giả định):
    label_map: {car: car, bus: bus, truck: truck, motorcycle: motorcycle, motorbike: motorcycle,
                bicycle: bicycle, person: "@person", pedestrian: pedestrian, rider: "@rider"}
    labeled_classes: [car, bus, truck, motorcycle, motorcyclist, bicycle, cyclist, pedestrian]
    use_for_val: true
    enabled: false

  - id: roboflow_vn_traffic
    name: "Roboflow Universe – vn_traffic (projectxla)"
    tier: A
    domain: vn
    priority: 60
    homepage: "https://universe.roboflow.com/projectxla/vn_traffic"
    download: {method: roboflow, workspace: projectxla, project: vn_traffic, version: 1, format: yolov8}
    license: "Xem trang dự án trên Roboflow (thường CC BY 4.0)"
    citation: "projectxla, vn_traffic Dataset, Roboflow Universe"
    format: yolo_det                 # chỉ có box -> bước SAM tạo mask
    paths: {images: roboflow_vn_traffic/train/images, labels: roboflow_vn_traffic/train/labels, data_yaml: roboflow_vn_traffic/data.yaml}
    label_map: {car: car, bus: bus, truck: truck, motorbike: motorcycle, motorcycle: motorcycle, person: "@person", bicycle: bicycle}
    labeled_classes: [car, bus, truck, motorcycle, motorcyclist, bicycle, cyclist, pedestrian]
    enabled: false

  - id: zalo_traffic_sign_2020
    name: "Zalo AI Challenge 2020 – Traffic Sign Detection"
    tier: A
    domain: vn
    priority: 55
    homepage: "https://datasetninja.com/zalo-traffic-sign"
    download: {method: manual, instructions: "Tải bản gốc Zalo AI 2020 (traffic sign); đặt ảnh vào raw/zalo_traffic_sign_2020/images và json COCO vào annotations.json"}
    license: "Không rõ (unknown) – chỉ dùng nội bộ"
    citation: "Zalo AI Challenge 2020"
    format: coco_bbox
    paths: {images: zalo_traffic_sign_2020/images, annotations: zalo_traffic_sign_2020/annotations.json}
    label_map: {"*": sign}
    labeled_classes: [sign]          # các class khác KHÔNG được gán -> partial
    enabled: false

  # Ảnh đường phố VN chỉ có box biển báo. SAM biến box thành mask; teacher yolo26x-seg (COCO) gán nháp
  # ô tô/bus/xe tải/xe máy/xe đạp/người/đèn; resolve ghép người + xe theo luật BTC.
  # COCO không có lớp "phương tiện khác" -> chấp nhận thiếu class 3 (accept_missing) để có miền VN.
  - id: vn_traffic_sign_hf
    name: "Vietnam Traffic Sign (HF: thanhhiepvos/vietnam_traffic_sign) + nhãn nháp teacher"
    tier: A
    domain: vn
    priority: 80
    homepage: "https://huggingface.co/datasets/thanhhiepvos/vietnam_traffic_sign"
    download: {method: hf, command: "python scripts/download_hf.py vn_signs"}
    license: "CC BY-SA 3.0 (theo thẻ dataset trên HF)"
    citation: "thanhhiepvos, vietnam_traffic_sign, Hugging Face Datasets"
    format: yolo_det
    paths: {images: vn_traffic_sign_hf/archive/images, labels: vn_traffic_sign_hf/archive/labels,
            names_file: vn_traffic_sign_hf/archive/classes_en.txt}
    label_map: {"*": sign}
    labeled_classes: [sign]
    accept_missing: [other_vehicle]
    use_for_val: false
    # v2: bỏ nhãn máy cũ nhóm người/xe 2 bánh (teacher COCO tách người lái thành pedestrian khi nhìn từ
    # phía sau) -> teacher 11 lớp đoán thẳng motorcyclist/cyclist; giữ ô tô/bus/tải/đèn của COCO-x (recall cao
    # hơn model n), teacher v2 chỉ thêm vào chỗ trống; bổ sung biển còn thiếu.
    teacher_replace: ["@person", pedestrian, motorcyclist, cyclist, motorcycle, bicycle]
    teacher_fill: [sign, traffic_light]
    enabled: true

  # ================= Bộ dữ liệu nhóm tải lên Google Drive (27/11) =================
  # Drive: https://drive.google.com/drive/folders/1zFSYZyxC4dTGdefRL5zciOVzylwaFBSK  (zip gốc giữ trong raw/_drive/)

  # Ảnh đường VN, box 4 lớp phương tiện (xe máy chiếm đa số). Box xe máy phủ cả người lái -> SAM tạo mask,
  # teacher COCO thêm người (@person) để resolve tách 4/5. Biển báo & đèn không được gán.
  - id: roboflow_traffic_vn
    name: "Roboflow Universe – Traffic_VN v1 (thiens-workspace-mryll)"
    tier: A
    domain: vn
    priority: 85
    homepage: "https://universe.roboflow.com/thiens-workspace-mryll/traffic_vn-2sdka/dataset/1"
    download: {method: drive, file: "Traffic_VN.v1-v1.yolo26.zip"}
    license: "CC BY 4.0"
    citation: "thiens-workspace-mryll, Traffic_VN v1, Roboflow Universe"
    format: yolo_det
    paths: {images: roboflow_traffic_vn, labels: roboflow_traffic_vn, data_yaml: roboflow_traffic_vn/data.yaml}
    group_regex: "([^/]+)$"
    label_map: {Bus: bus, Car: car, Motorcycle: motorcycle, Truck: truck}
    ridden_default: true        # camera quay mặt đường: xe máy đang chạy luôn có người (box đã bao người lái)
    labeled_classes: [car, bus, truck, motorcycle]
    accept_missing: [other_vehicle, sign]
    use_for_val: false
    # v2: bỏ nhãn máy cũ nhóm người/xe 2 bánh (teacher COCO tách người lái thành pedestrian khi nhìn từ
    # phía sau) -> teacher 11 lớp đoán thẳng motorcyclist/cyclist; giữ ô tô/bus/tải/đèn của COCO-x (recall cao
    # hơn model n), teacher v2 chỉ thêm vào chỗ trống; bổ sung biển còn thiếu.
    teacher_replace: ["@person", pedestrian, motorcyclist, cyclist, motorcycle, bicycle]
    teacher_fill: [sign, traffic_light]
    enabled: true

  # Ảnh đường VN, box 57 loại biển báo (ảnh đã bị Roboflow resize về 640x640).
  - id: roboflow_vn_traffic_v2i
    name: "Roboflow Universe – vn_traffic v2 (projectxla), biển báo VN"
    tier: A
    domain: vn
    priority: 75
    homepage: "https://universe.roboflow.com/projectxla/vn_traffic/dataset/2"
    download: {method: drive, file: "vn_traffic.v2i.yolo26.zip"}
    license: "CC BY 4.0"
    citation: "projectxla, vn_traffic v2, Roboflow Universe"
    format: yolo_det
    paths: {images: roboflow_vn_traffic_v2i, labels: roboflow_vn_traffic_v2i, data_yaml: roboflow_vn_traffic_v2i/data.yaml}
    group_regex: "([^/]+)$"
    label_map: {"*": sign}
    labeled_classes: [sign]
    accept_missing: [other_vehicle]
    use_for_val: false
    # v2: bỏ nhãn máy cũ nhóm người/xe 2 bánh (teacher COCO tách người lái thành pedestrian khi nhìn từ
    # phía sau) -> teacher 11 lớp đoán thẳng motorcyclist/cyclist; giữ ô tô/bus/tải/đèn của COCO-x (recall cao
    # hơn model n), teacher v2 chỉ thêm vào chỗ trống; bổ sung biển còn thiếu.
    teacher_replace: ["@person", pedestrian, motorcyclist, cyclist, motorcycle, bicycle]
    teacher_fill: [sign, traffic_light]
    enabled: true

  # COCO 2017 cảnh phố, nhóm đã đổi sẵn sang 11 lớp YOLO-seg (đã ghép người lái).
  # COCO không có lớp biển báo chung (chỉ stop sign) và không có "phương tiện khác" -> thiếu nhãn biển báo:
  # ảnh nào có biển mà không gán sẽ dạy model rằng biển là nền. Cần teacher 11 lớp trước khi dùng.
  - id: coco2017_street_yoloseg
    name: "MS COCO 2017 – cảnh phố, nhóm đổi sang 11 lớp YOLO-seg"
    tier: C
    domain: global
    priority: 40
    homepage: "https://cocodataset.org/"
    download: {method: drive, file: "coco2017_street_yoloseg.zip"}
    license: "Annotations CC BY 4.0; ảnh theo license Flickr từng ảnh"
    citation: "Lin et al., Microsoft COCO: Common Objects in Context, ECCV 2014"
    format: yolo_seg
    paths: {images: coco2017_street_yoloseg/images, labels: coco2017_street_yoloseg/labels, data_yaml: coco2017_street_yoloseg/data.yaml}
    label_map: {car: car, bus: bus, truck: truck, other_vehicle: other_vehicle, motorcycle: motorcycle,
                motorcyclist: motorcyclist, bicycle: bicycle, cyclist: cyclist, pedestrian: "@person",  # v2: nhóm gán người trên xe = pedestrian -> để resolve ghép rider
               
                sign: sign, traffic_light: traffic_light}
    labeled_classes: [car, bus, truck, motorcycle, motorcyclist, bicycle, cyclist, pedestrian, traffic_light]
    accept_missing: []
    max_images: 2500   # v2: giữ thời gian/epoch trong hạn
    use_for_val: false
    # v2: teacher 11 lớp bổ sung biển báo + phương tiện khác
    enabled: true

  # BDD100K 10k: CHỈ CÓ ẢNH (không có file nhãn) -> cần nhãn chính thức hoặc teacher 11 lớp.
  - id: bdd100k_10k_images
    name: "BDD100K – 10k ảnh (chưa có nhãn)"
    tier: C
    domain: global
    priority: 30
    homepage: "https://bdd-data.berkeley.edu/"
    download: {method: drive, file: "bdd100k_10k_images.zip"}
    license: "BDD100K license (xem file LICENSE chính thức)"
    citation: "Yu et al., BDD100K: A Diverse Driving Dataset for Heterogeneous Multitask Learning, CVPR 2020"
    format: images_only
    paths: {images: bdd100k_10k_images}
    group_regex: "([^/]+)$"
    label_map: {}
    labeled_classes: []
    use_for_val: false
    enabled: false

  # nuImages v1.0 (nuScenes, Singapore + Boston): instance masks + attribute cycle.with_rider.
  # Chỉ lấy 16k key frame có lớp hiếm (bus, xe đạp, xe công trình/rơ-moóc, xe tải, xe máy) — scripts/nuimages_select.py.
  # Không có nhãn biển báo / đèn: teacher COCO bổ sung đèn; biển báo chấp nhận thiếu (ghi rõ trong báo cáo).
  - id: nuimages
    name: "nuImages v1.0 – tập con 16k ảnh có lớp hiếm"
    tier: C
    domain: global
    priority: 55
    homepage: "https://www.nuscenes.org/nuimages (bản sao HF: https://huggingface.co/datasets/Myszz/NuImages)"
    download: {method: hf, command: "hf_hub_download Myszz/NuImages nuimages-v1.0-all-{metadata,samples}.tgz; python scripts/nuimages_select.py"}
    license: "CC BY-NC-SA 4.0 (nuScenes terms of use, phi thương mại)"
    citation: "Caesar et al., nuScenes: A multimodal dataset for autonomous driving, CVPR 2020"
    format: nuimages
    paths: {root: nuimages, images: nuimages/samples}
    label_map:
      "vehicle.car": car
      "vehicle.emergency.*": car          # xe cứu thương dạng van / xe cảnh sát -> Car (BTC)
      "vehicle.bus.*": bus
      "vehicle.truck": truck
      "vehicle.trailer": other_vehicle    # rơ-moóc (BTC: Other vehicle)
      "vehicle.construction": other_vehicle
      "vehicle.motorcycle": motorcycle    # + thuộc tính cycle.with_rider -> 5
      "vehicle.bicycle": bicycle          # + thuộc tính cycle.with_rider -> 7
      "human.pedestrian.adult": "@person"
      "human.pedestrian.child": "@person"
      "human.pedestrian.construction_worker": "@person"
      "human.pedestrian.police_officer": "@person"
      "human.pedestrian.personal_mobility": "@ignore"
      "human.pedestrian.stroller": "@ignore"
      "human.pedestrian.wheelchair": "@ignore"
      "vehicle.ego": "@ignore"
      "static_object.bicycle_rack": "@ignore"
    labeled_classes: [car, bus, truck, other_vehicle, motorcycle, motorcyclist, bicycle, cyclist, pedestrian]
    accept_missing: []
    use_for_val: false
    # v2: teacher 11 lớp bổ sung đèn + biển báo (nuImages không gán 2 lớp này)
    max_images: 6000   # v2: giữ thời gian/epoch trong hạn
    enabled: true

  # Tuk-tuk / rickshaw (HF, ghép từ nhiều bộ Roboflow, CC BY 4.0) — nguồn class 3 kiểu châu Á (xe ba bánh,
  # máy kéo). Lớp số không tên đã được xác định bằng mắt: 0,4 = auto-rickshaw; 5 = máy kéo/rơ-moóc nông nghiệp;
  # 1 = bus; 2 = ô tô; 6 = xe tải. Chỉ class 3 coi là gán đủ; teacher bổ sung phần còn lại (không trùng box có sẵn).
  - id: tuk_tuk_rickshaw_hf
    name: "Tuk Tuk & Rickshaw Detection (HF shravya11/tuk-tuk-detection)"
    tier: B
    domain: asia
    priority: 45
    homepage: "https://huggingface.co/datasets/shravya11/tuk-tuk-detection"
    download: {method: hf, command: "snapshot_download shravya11/tuk-tuk-detection -> raw/tuk_tuk_hf"}
    license: "CC BY 4.0"
    citation: "shravya11, Tuk Tuk and Rickshaw Detection, Hugging Face Datasets (from Roboflow Universe)"
    format: coco_bbox
    prefix_split: true
    sample_images: 1800         # chỉ lấy ngẫu nhiên 1,800/5,890 ảnh (giới hạn thời gian GPU)
    paths:
      images: tuk_tuk_hf
      annotations: [tuk_tuk_hf/train/_annotations.coco.json, tuk_tuk_hf/valid/_annotations.coco.json,
                    tuk_tuk_hf/test/_annotations.coco.json, tuk_tuk_hf/rickshaw/train/_annotations.coco.json,
                    tuk_tuk_hf/rickshaw/valid/_annotations.coco.json, tuk_tuk_hf/rickshaw/test/_annotations.coco.json]
    group_regex: "([^/]+)$"
    label_map: {tuktuk: other_vehicle, Rickshaw: other_vehicle, auto-rickshaw: other_vehicle, auto: other_vehicle,
                "0": other_vehicle, "4": other_vehicle, "5": other_vehicle,
                "1": bus, bus: bus, "2": car, car: car, Car: car, "6": truck, truck: truck, lorry: truck,
                motorcycle: motorcycle, bicycle: bicycle, bike: bicycle, Bike: bicycle}
    labeled_classes: [other_vehicle]
    accept_missing: [sign]
    use_for_val: false
    # v2: bỏ nhãn máy cũ nhóm người/xe 2 bánh (teacher COCO tách người lái thành pedestrian khi nhìn từ
    # phía sau) -> teacher 11 lớp đoán thẳng motorcyclist/cyclist; giữ ô tô/bus/tải/đèn của COCO-x (recall cao
    # hơn model n), teacher v2 chỉ thêm vào chỗ trống; bổ sung biển còn thiếu.
    teacher_replace: ["@person", pedestrian, motorcyclist, cyclist, motorcycle, bicycle]
    teacher_fill: [sign, traffic_light]
    enabled: true

  # ACDC "half" (nhóm lấy 1/2 mỗi điều kiện): CHỈ CÓ ẢNH rgb_anon, không có gt_panoptic.
  # train 811 · val 209 · test 1,009 (test của ACDC không công bố nhãn). manifest.csv giữ đường dẫn gốc.
  # Cần gt_panoptic (train+val) từ acdc.vision.ee.ethz.ch hoặc teacher 11 lớp trước khi dùng để train.
  - id: acdc_half
    name: "ACDC – nửa mỗi điều kiện (fog/night/rain/snow), chưa có nhãn"
    tier: D
    domain: global
    priority: 60
    homepage: "https://acdc.vision.ee.ethz.ch/"
    download: {method: drive, file: "acdc_half.zip"}
    license: "ACDC license (phi thương mại)"
    citation: "Sakaridis et al., ACDC: The Adverse Conditions Dataset with Correspondences, ICCV 2021 / T-PAMI 2025"
    format: images_only
    paths: {images: acdc_half}
    attr_from_path: {weather: "(fog|night|rain|snow)"}
    label_map: {}
    labeled_classes: []
    use_for_val: false
    enabled: false

  # Roboflow Universe vietnam_vehicles (CC BY 4.0, 1,648 ảnh VN, box 17 lớp) — nguồn DUY NHẤT tìm được có
  # xe ba gác + xích lô VN (class 3). SAM tạo mask từ box, teacher v2 bổ sung lớp còn lại.
  # Tải: universe.roboflow.com/vietnamvehicles/vietnam_vehicles-gyuve (định dạng YOLO) -> raw/rf_vietnam_vehicles/
  - id: rf_vietnam_vehicles
    name: "Roboflow Universe – vietnam_vehicles (xe ba gác, xích lô, xe khách...)"
    tier: A
    domain: vn
    priority: 88
    homepage: "https://universe.roboflow.com/vietnamvehicles/vietnam_vehicles-gyuve"
    download: {method: manual, instructions: "Đăng nhập Roboflow, Download Dataset -> YOLOv8 -> zip, giải nén vào raw/rf_vietnam_vehicles"}
    license: "CC BY 4.0"
    citation: "vietnamvehicles, vietnam_vehicles Dataset, Roboflow Universe (2024)"
    format: yolo_det
    paths: {images: rf_vietnam_vehicles, labels: rf_vietnam_vehicles, data_yaml: rf_vietnam_vehicles/data.yaml}
    group_regex: "([^/]+)$"
    # BTC: bán tải, van, cứu thương dạng van, xe 9-15 chỗ = Car; xe khách 16+ = Bus; đầu kéo/bồn/cứu hoả/trộn bê tông = Truck;
    #      ba gác, xích lô = Other vehicle
    label_map: {xe_oto_con: car, xe_ban_tai: car, xe_van: car, xe_cap_cuu: car, xe_canh_sat: car,
                xe_khach16: bus, xe_khach32: bus,
                xe_tai: truck, xe_dau_keo: truck, xe_bon: truck, xe_cuu_hoa: truck, xe_tron_betong: truck, xe_quan_doi: truck,
                xe_ba_gac: other_vehicle, xe_xich_lo: other_vehicle,
                xe_may: motorcycle, xe_dap: bicycle}
    labeled_classes: [car, bus, truck, other_vehicle]
    teacher_replace: true
    teacher_fill: [motorcycle, motorcyclist, bicycle, cyclist, pedestrian, sign, traffic_light]
    use_for_val: false
    enabled: false

