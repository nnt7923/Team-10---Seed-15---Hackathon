  # ---------------------------------------------------------- Tier B: châu Á
  # ⏱ IDD và Cityscapes phải chờ duyệt tài khoản (có thể vài ngày) -> chỉ dùng nếu đã có tài khoản.
  - id: idd_segmentation
    name: "India Driving Dataset (IDD) – Segmentation"
    tier: B
    domain: asia
    priority: 70
    homepage: "https://inai.iiit.ac.in/domains/idd.html"
    download: {method: drive, file: "IDD_Segmentation.zip",
               note: "Nhóm tải lên Drive; giải nén train + val vào raw/idd/{gtFine,leftImg8bit} (test không có nhãn)"}
    license: "IDD license (phi thương mại, nghiên cứu)"
    citation: "Varma et al., IDD: A Dataset for Exploring Problems of Autonomous Navigation in Unconstrained Environments, WACV 2019"
    format: polygons_json
    paths: {annotations: idd/gtFine, images: idd/leftImg8bit}
    name_replace: ["_gtFine_polygons.json", "_leftImg8bit.png"]
    occlusion_order: back_to_front
    label_map:
      person: pedestrian
      rider: "@rider"
      motorcycle: motorcycle
      bicycle: bicycle
      autorickshaw: other_vehicle
      car: car
      truck: truck
      bus: bus
      caravan: other_vehicle
      trailer: other_vehicle
      train: other_vehicle
      "vehicle fallback": other_vehicle
      "traffic sign": sign
      "traffic light": traffic_light
      "*group": "@ignore"
      # cố ý bỏ (BTC không gán):
      "ego vehicle": "@ignore"
      "license plate": "@ignore"
      billboard: "@ignore"        # biển quảng cáo
      animal: "@ignore"
    labeled_classes: *ALL
    enabled: true

  # ------------------------------------------------------ Tier C: bộ lớn
  - id: mapillary_vistas_v2
    name: "Mapillary Vistas v2.0"
    tier: C
    domain: global
    priority: 75
    homepage: "https://www.mapillary.com/dataset/vistas (bản sao HF: https://huggingface.co/datasets/ali-sh07/Mapillary-dataset)"
    download: {method: hf, command: "python scripts/download_hf.py mapillary",
               note: "Bản sao HF có 9,999/18,000 ảnh training; polygons v2.0 thiếu nên dùng nhãn panoptic v2.0 (không chồng lấn sẵn)"}
    license: "CC BY-NC-SA 4.0 (Research edition)"
    citation: "Neuhold et al., The Mapillary Vistas Dataset for Semantic Understanding of Street Scenes, ICCV 2017"
    format: coco_panoptic
    paths: {annotations: mapillary/training/v2.0/panoptic/panoptic_2020.json,
            panoptic_png: mapillary/training/v2.0/panoptic, images: mapillary/training/images}
    label_map: &MAPILLARY_MAP
      "human--person--individual": pedestrian
      "human--person--person-group": "@ignore"
      "human--rider--motorcyclist": "@rider_moto"
      "human--rider--bicyclist": "@rider_bike"
      "human--rider--other-rider": "@rider"
      "object--vehicle--car": car
      "object--vehicle--bus": bus
      "object--vehicle--truck": truck
      "object--vehicle--motorcycle": motorcycle
      "object--vehicle--bicycle": bicycle
      "object--vehicle--caravan": other_vehicle
      "object--vehicle--trailer": other_vehicle
      "object--vehicle--other-vehicle": other_vehicle
      "object--vehicle--on-rails": other_vehicle      # BTC: mọi phương tiện không thuộc lớp khác
      "object--vehicle--wheeled-slow": "@ignore"      # xe đẩy tay, xe lăn: BTC KHÔNG gán
      "object--vehicle--vehicle-group": "@ignore"
      "object--traffic-light--*": traffic_light
      "object--traffic-sign--*back*": "@ignore"
      "object--traffic-sign--*": sign
      # cố ý bỏ (BTC không gán) — khai báo rõ để báo cáo không coi là "quên ánh xạ":
      "object--sign--*": "@ignore"                    # biển quảng cáo / cửa hàng / thông tin, không phải biển giao thông
      "object--support--traffic-sign-frame": "@ignore" # khung/cột đỡ biển: BTC chỉ phủ mặt biển
      "object--street-light": "@ignore"               # đèn đường, không phải đèn tín hiệu
      "void--ego-vehicle": "@ignore"                  # xe ghi hình
      "void--car-mount": "@ignore"
      "object--vehicle--boat": "@ignore"
      "object--bike-rack": "@ignore"
      "marking--*": "@ignore"                         # vạch sơn (kể cả biểu tượng xe đạp trên mặt đường)
      "marking-only--*": "@ignore"
    labeled_classes: *ALL
    enabled: true

  # Bản sao HF có ảnh và nhãn panoptic là 2 tập con KHÁC NHAU (chỉ 5,390 ảnh có cả hai). 752 ảnh còn lại có
  # file polygons v2.0 -> đọc bằng polygons_json (vẽ lại theo thứ tự che khuất), cùng ánh xạ nhãn.
  - id: mapillary_vistas_v2_poly
    name: "Mapillary Vistas v2.0 – phần chỉ có polygons (752 ảnh)"
    tier: C
    domain: global
    priority: 74
    homepage: "https://www.mapillary.com/dataset/vistas (bản sao HF: https://huggingface.co/datasets/ali-sh07/Mapillary-dataset)"
    download: {method: hf, note: "training/v2.0/polygons/<id>.json cho ảnh không có panoptic"}
    license: "CC BY-NC-SA 4.0 (Research edition)"
    citation: "Neuhold et al., The Mapillary Vistas Dataset for Semantic Understanding of Street Scenes, ICCV 2017"
    format: polygons_json
    paths: {annotations: mapillary/training/v2.0/polygons, images: mapillary/training/images}
    name_replace: [".json", ".jpg"]
    occlusion_order: back_to_front
    label_map: *MAPILLARY_MAP
    labeled_classes: *ALL
    enabled: true

