  - id: coco2017_street
    name: "MS COCO 2017 – tập con cảnh đường phố"
    tier: C
    domain: global
    priority: 40
    homepage: "https://cocodataset.org/"
    download: {method: url, files: ["http://images.cocodataset.org/annotations/annotations_trainval2017.zip"],
               images_url: "http://images.cocodataset.org/train2017/{file_name}", note: "Chỉ tải ảnh đã qua bộ lọc (scripts/download.py)"}
